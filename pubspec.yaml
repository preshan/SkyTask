name: skytask
description: SkyTask — premium productivity app for tasks, reminders, ideas, and notes.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1

  # Notifications & background
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  android_alarm_manager_plus: ^4.0.3
  workmanager: ^0.9.0

  # Calendar
  device_calendar: ^4.3.3

  # Security
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # UI & utilities
  crypto: ^3.0.3
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  hugeicons: ^1.1.7
  record: ^7.1.1
  audioplayers: ^6.8.1
  permission_handler: ^13.0.0
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
